<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Js</title>
    <style>
        body{
            background-color: turquoise;
        }
    </style>
</head>
<body>
    <a href="#" onclick="clicou()">Clique em mim</a>
    <div id="saida"></div>

    <script>
        function clicou(){
            s = window.document.getElementById("saida");
            s.innerHTML += "<h1>Você clicou no link!</h1>";
        }
    </script>
</body>
</html>
