<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        .container{
            background-color: lightsalmon;
            display: flex;
            flex-flow: row wrap;
        }

        .item{
            background-color: lightblue;
            border: 1px solid black;

            flex: auto;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Eemplo de bloco: A</div>
        <div class="item">Eemplo de bloco: B</div>
        <div class="item">Eemplo de bloco: C</div>
        <div class="item">Eemplo de bloco: D</div>
        <div class="item">Eemplo de bloco: E</div>
        <div class="item">Eemplo de bloco: F</div>
    </div>
</body>
</html>
